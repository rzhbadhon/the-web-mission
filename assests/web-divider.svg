<svg width="100%" height="26" viewBox="0 0 1000 26" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="animated web strand divider" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="strand" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ff4d6d" stop-opacity="0"/>
      <stop offset="12%" stop-color="#ff4d6d"/>
      <stop offset="50%" stop-color="#ffd166"/>
      <stop offset="88%" stop-color="#ff8a5c"/>
      <stop offset="100%" stop-color="#ff8a5c" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <line x1="0" y1="13" x2="1000" y2="13" stroke="url(#strand)" stroke-width="1.5" stroke-dasharray="6 5" opacity="0.75">
    <animate attributeName="stroke-dashoffset" from="0" to="-44" dur="2.4s" repeatCount="indefinite"/>
  </line>
  <circle cx="0" cy="13" r="4" fill="#ffd166">
    <animateMotion dur="4.5s" repeatCount="indefinite" path="M 0,0 L 1000,0"/>
    <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.06;0.94;1" dur="4.5s" repeatCount="indefinite"/>
  </circle>
  <circle cx="150" cy="13" r="2" fill="#ffffff" opacity="0.6">
    <animate attributeName="opacity" values="0.2;0.9;0.2" dur="2.1s" repeatCount="indefinite"/>
  </circle>
  <circle cx="480" cy="13" r="2" fill="#ffffff" opacity="0.6">
    <animate attributeName="opacity" values="0.8;0.2;0.8" dur="2.6s" repeatCount="indefinite"/>
  </circle>
  <circle cx="820" cy="13" r="2" fill="#ffffff" opacity="0.6">
    <animate attributeName="opacity" values="0.3;0.9;0.3" dur="1.9s" repeatCount="indefinite"/>
  </circle>
</svg>
