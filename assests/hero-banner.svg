<svg width="100%" height="300" viewBox="0 0 1000 300" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="The Web Mission animated banner" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#080417"/>
      <stop offset="55%" stop-color="#180b3d"/>
      <stop offset="100%" stop-color="#2c1457"/>
    </linearGradient>
    <linearGradient id="glow" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ff4d6d"/>
      <stop offset="50%" stop-color="#ff8a5c"/>
      <stop offset="100%" stop-color="#ffd166"/>
    </linearGradient>
    <radialGradient id="moonGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fff8e7" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#fff8e7" stop-opacity="0"/>
    </radialGradient>
    <filter id="softGlow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="1000" height="300" fill="url(#sky)"/>

  <g fill="#ffffff">
    <circle cx="40" cy="26" r="1.3"><animate attributeName="opacity" values="0.15;1;0.15" dur="2.6s" repeatCount="indefinite"/></circle>
    <circle cx="95" cy="55" r="1"><animate attributeName="opacity" values="1;0.2;1" dur="3.4s" repeatCount="indefinite"/></circle>
    <circle cx="150" cy="20" r="1.4"><animate attributeName="opacity" values="0.2;1;0.2" dur="2.1s" repeatCount="indefinite"/></circle>
    <circle cx="205" cy="45" r="1"><animate attributeName="opacity" values="0.8;0.1;0.8" dur="4s" repeatCount="indefinite"/></circle>
    <circle cx="330" cy="18" r="1.2"><animate attributeName="opacity" values="0.2;1;0.2" dur="2.8s" repeatCount="indefinite"/></circle>
    <circle cx="380" cy="40" r="1"><animate attributeName="opacity" values="1;0.2;1" dur="3.1s" repeatCount="indefinite"/></circle>
    <circle cx="430" cy="22" r="1.3"><animate attributeName="opacity" values="0.3;1;0.3" dur="2.4s" repeatCount="indefinite"/></circle>
    <circle cx="520" cy="15" r="1"><animate attributeName="opacity" values="0.9;0.15;0.9" dur="3.6s" repeatCount="indefinite"/></circle>
    <circle cx="580" cy="50" r="1.4"><animate attributeName="opacity" values="0.2;1;0.2" dur="2.2s" repeatCount="indefinite"/></circle>
    <circle cx="630" cy="24" r="1"><animate attributeName="opacity" values="1;0.25;1" dur="3s" repeatCount="indefinite"/></circle>
    <circle cx="30" cy="70" r="1"><animate attributeName="opacity" values="0.4;1;0.4" dur="2.9s" repeatCount="indefinite"/></circle>
    <circle cx="700" cy="18" r="1.2"><animate attributeName="opacity" values="0.2;1;0.2" dur="2.5s" repeatCount="indefinite"/></circle>
  </g>

  <circle cx="895" cy="55" r="58" fill="url(#moonGlow)"/>
  <circle cx="895" cy="55" r="24" fill="#fff8e7"/>

  <g fill="#150a2e">
    <rect x="0" y="190" width="60" height="110"/>
    <rect x="60" y="150" width="46" height="150"/>
    <rect x="106" y="205" width="60" height="95"/>
    <rect x="166" y="170" width="50" height="130"/>
    <rect x="216" y="235" width="45" height="65"/>
    <rect x="720" y="230" width="45" height="70"/>
    <rect x="765" y="180" width="55" height="120"/>
    <rect x="820" y="215" width="45" height="85"/>
    <rect x="865" y="160" width="55" height="140"/>
    <rect x="920" y="200" width="50" height="100"/>
    <rect x="970" y="175" width="30" height="125"/>
  </g>

  <g fill="#ffd166" opacity="0.75">
    <rect x="8" y="205" width="7" height="9"/>
    <rect x="22" y="205" width="7" height="9"/>
    <rect x="8" y="225" width="7" height="9"><animate attributeName="opacity" values="0.2;0.9;0.2" dur="2.4s" repeatCount="indefinite"/></rect>
    <rect x="22" y="225" width="7" height="9"/>
    <rect x="70" y="165" width="7" height="9"/>
    <rect x="85" y="165" width="7" height="9"><animate attributeName="opacity" values="0.9;0.15;0.9" dur="3.1s" repeatCount="indefinite"/></rect>
    <rect x="70" y="185" width="7" height="9"/>
    <rect x="85" y="205" width="7" height="9"/>
    <rect x="116" y="220" width="7" height="9"><animate attributeName="opacity" values="0.2;0.9;0.2" dur="2.7s" repeatCount="indefinite"/></rect>
    <rect x="140" y="235" width="7" height="9"/>
    <rect x="176" y="185" width="7" height="9"/>
    <rect x="195" y="200" width="7" height="9"><animate attributeName="opacity" values="0.9;0.2;0.9" dur="2.9s" repeatCount="indefinite"/></rect>
    <rect x="730" y="245" width="7" height="9"/>
    <rect x="775" y="195" width="7" height="9"><animate attributeName="opacity" values="0.2;0.9;0.2" dur="2.5s" repeatCount="indefinite"/></rect>
    <rect x="795" y="215" width="7" height="9"/>
    <rect x="830" y="230" width="7" height="9"/>
    <rect x="875" y="175" width="7" height="9"><animate attributeName="opacity" values="0.9;0.2;0.9" dur="3.3s" repeatCount="indefinite"/></rect>
    <rect x="895" y="195" width="7" height="9"/>
    <rect x="930" y="215" width="7" height="9"/>
    <rect x="978" y="190" width="7" height="9"><animate attributeName="opacity" values="0.2;0.9;0.2" dur="2.6s" repeatCount="indefinite"/></rect>
  </g>

  <rect x="0" y="278" width="1000" height="22" fill="#070310"/>
  <line x1="0" y1="289" x2="1000" y2="289" stroke="#ffd166" stroke-width="3" stroke-dasharray="22 18" opacity="0.55">
    <animate attributeName="stroke-dashoffset" from="0" to="-80" dur="1.1s" repeatCount="indefinite"/>
  </line>

  <g>
    <g id="hyperCar">
      <ellipse cx="0" cy="16" rx="34" ry="5" fill="#000" opacity="0.35"/>
      <rect x="-30" y="-4" width="60" height="14" rx="6" fill="#0f0c22" stroke="url(#glow)" stroke-width="1.4"/>
      <path d="M -13,-4 L -5,-15 L 13,-15 L 19,-4 Z" fill="#0f0c22" stroke="url(#glow)" stroke-width="1"/>
      <circle cx="-18" cy="11" r="6" fill="#050508"/>
      <circle cx="18" cy="11" r="6" fill="#050508"/>
      <rect x="-30" y="8" width="60" height="2" fill="#ff8a5c" opacity="0.85"/>
    </g>
    <animateMotion dur="7s" repeatCount="indefinite" path="M -100,272 L 1100,272"/>
  </g>

  <g>
    <line x1="300" y1="25" x2="300" y2="118" stroke="#eaeaea" stroke-width="1.4" opacity="0.8"/>
    <g transform="translate(300,118)">
      <circle cx="0" cy="9" r="8" fill="#0a0a0f"/>
      <line x1="0" y1="17" x2="0" y2="44" stroke="#0a0a0f" stroke-width="4" stroke-linecap="round"/>
      <line x1="0" y1="23" x2="-15" y2="9" stroke="#0a0a0f" stroke-width="3" stroke-linecap="round"/>
      <line x1="0" y1="23" x2="15" y2="33" stroke="#0a0a0f" stroke-width="3" stroke-linecap="round"/>
      <line x1="0" y1="44" x2="-11" y2="65" stroke="#0a0a0f" stroke-width="3" stroke-linecap="round"/>
      <line x1="0" y1="44" x2="12" y2="63" stroke="#0a0a0f" stroke-width="3" stroke-linecap="round"/>
    </g>
    <animateTransform attributeName="transform" type="rotate" values="-30 300 25; 30 300 25; -30 300 25" keyTimes="0;0.5;1" dur="3.4s" calcMode="spline" keySplines="0.45 0 0.55 1;0.45 0 0.55 1" repeatCount="indefinite"/>
  </g>

  <text x="500" y="150" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="46" font-weight="700" fill="url(#glow)" filter="url(#softGlow)">
    THE WEB MISSION
    <animate attributeName="opacity" values="0.82;1;0.82" dur="2.6s" repeatCount="indefinite"/>
  </text>
  <text x="500" y="182" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="16" letter-spacing="3" fill="#f3e9ff" opacity="0.8">
    A VOICE-DRIVEN CINEMATIC INVITATION
  </text>
</svg>
