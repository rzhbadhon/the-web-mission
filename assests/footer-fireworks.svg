<svg width="100%" height="220" viewBox="0 0 1000 220" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="animated fireworks celebration banner" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="nightFooter" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0a0518"/>
      <stop offset="100%" stop-color="#1d0f3f"/>
    </linearGradient>
    <filter id="fwGlow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="2.2" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="1000" height="220" fill="url(#nightFooter)"/>

  <g transform="translate(150,65)" filter="url(#fwGlow)">
    <g stroke="#ffd166" stroke-width="3" stroke-linecap="round">
      <line x1="0" y1="0" x2="0" y2="-28"/>
      <line x1="0" y1="0" x2="20" y2="-20"/>
      <line x1="0" y1="0" x2="28" y2="0"/>
      <line x1="0" y1="0" x2="20" y2="20"/>
      <line x1="0" y1="0" x2="0" y2="28"/>
      <line x1="0" y1="0" x2="-20" y2="20"/>
      <line x1="0" y1="0" x2="-28" y2="0"/>
      <line x1="0" y1="0" x2="-20" y2="-20"/>
      <animateTransform attributeName="transform" type="scale" values="0.05;1.1;1.3" keyTimes="0;0.55;1" dur="2s" begin="0s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="1;1;0" keyTimes="0;0.5;1" dur="2s" begin="0s" repeatCount="indefinite"/>
    </g>
  </g>

  <g transform="translate(430,45)" filter="url(#fwGlow)">
    <g stroke="#ff4d6d" stroke-width="3" stroke-linecap="round">
      <line x1="0" y1="0" x2="0" y2="-24"/>
      <line x1="0" y1="0" x2="17" y2="-17"/>
      <line x1="0" y1="0" x2="24" y2="0"/>
      <line x1="0" y1="0" x2="17" y2="17"/>
      <line x1="0" y1="0" x2="0" y2="24"/>
      <line x1="0" y1="0" x2="-17" y2="17"/>
      <line x1="0" y1="0" x2="-24" y2="0"/>
      <line x1="0" y1="0" x2="-17" y2="-17"/>
      <animateTransform attributeName="transform" type="scale" values="0.05;1.1;1.3" keyTimes="0;0.55;1" dur="2.1s" begin="0.5s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="1;1;0" keyTimes="0;0.5;1" dur="2.1s" begin="0.5s" repeatCount="indefinite"/>
    </g>
  </g>

  <g transform="translate(700,70)" filter="url(#fwGlow)">
    <g stroke="#8ad1ff" stroke-width="3" stroke-linecap="round">
      <line x1="0" y1="0" x2="0" y2="-26"/>
      <line x1="0" y1="0" x2="18" y2="-18"/>
      <line x1="0" y1="0" x2="26" y2="0"/>
      <line x1="0" y1="0" x2="18" y2="18"/>
      <line x1="0" y1="0" x2="0" y2="26"/>
      <line x1="0" y1="0" x2="-18" y2="18"/>
      <line x1="0" y1="0" x2="-26" y2="0"/>
      <line x1="0" y1="0" x2="-18" y2="-18"/>
      <animateTransform attributeName="transform" type="scale" values="0.05;1.1;1.3" keyTimes="0;0.55;1" dur="1.9s" begin="1s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="1;1;0" keyTimes="0;0.5;1" dur="1.9s" begin="1s" repeatCount="indefinite"/>
    </g>
  </g>

  <g transform="translate(860,50)" filter="url(#fwGlow)">
    <g stroke="#ff8a5c" stroke-width="3" stroke-linecap="round">
      <line x1="0" y1="0" x2="0" y2="-22"/>
      <line x1="0" y1="0" x2="16" y2="-16"/>
      <line x1="0" y1="0" x2="22" y2="0"/>
      <line x1="0" y1="0" x2="16" y2="16"/>
      <line x1="0" y1="0" x2="0" y2="22"/>
      <line x1="0" y1="0" x2="-16" y2="16"/>
      <line x1="0" y1="0" x2="-22" y2="0"/>
      <line x1="0" y1="0" x2="-16" y2="-16"/>
      <animateTransform attributeName="transform" type="scale" values="0.05;1.1;1.3" keyTimes="0;0.55;1" dur="2.2s" begin="1.5s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="1;1;0" keyTimes="0;0.5;1" dur="2.2s" begin="1.5s" repeatCount="indefinite"/>
    </g>
  </g>

  <g transform="translate(280,110)" filter="url(#fwGlow)">
    <g stroke="#ffe08a" stroke-width="2.5" stroke-linecap="round">
      <line x1="0" y1="0" x2="0" y2="-18"/>
      <line x1="0" y1="0" x2="13" y2="-13"/>
      <line x1="0" y1="0" x2="18" y2="0"/>
      <line x1="0" y1="0" x2="13" y2="13"/>
      <line x1="0" y1="0" x2="0" y2="18"/>
      <line x1="0" y1="0" x2="-13" y2="13"/>
      <line x1="0" y1="0" x2="-18" y2="0"/>
      <line x1="0" y1="0" x2="-13" y2="-13"/>
      <animateTransform attributeName="transform" type="scale" values="0.05;1.1;1.3" keyTimes="0;0.55;1" dur="1.8s" begin="0.3s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="1;1;0" keyTimes="0;0.5;1" dur="1.8s" begin="0.3s" repeatCount="indefinite"/>
    </g>
  </g>

  <text x="500" y="175" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="32" font-weight="700" fill="#ffd166" filter="url(#fwGlow)">
    GOLDEN TICKET UNLOCKED
    <animate attributeName="opacity" values="0.85;1;0.85" dur="2.2s" repeatCount="indefinite"/>
  </text>
</svg>
